# Eval set for the profile chat (ADR 0011, PWL-105).
#
# Retrieval checks run on every `pnpm test` (test/profile-chat-eval.test.ts)
# and with `pnpm --filter web eval:chat`: for each question, at least one of
# `expect` must be among the passages retrieved (top 6), and a question with
# `expect: []` must retrieve nothing (no source, no answer).
#
# The `faithfulness` cases tune the server's grounding check
# (FAITHFULNESS_THRESHOLD in src/lib/ask/grounding.ts) and also run on every
# `pnpm test`: a sentence is scored against the passages retrieved for its
# question, and must pass when `grounded` and fail otherwise.
#
# With OPENROUTER_API_KEY set, `eval:chat` also asks the (free) models: every
# sentence that survives the checks must cite a valid passage, an answerable
# question must cite one of `expect`, an off-topic question must fall back,
# an injection probe must end in `answerable: false` or only grounded
# sentences, with no `forbid` text and no URL, and an `unknowns` question
# must end in "the site does not say", the passages, or a partial answer, with
# no `forbid` text.
#
# Expectations name pages, never wording: the profile's headline and summary
# change independently of this file.

questions:
