# Sentences a model might write, scored against the passages retrieved for
# the question. Grounded ones paraphrase the content; the others add claims the
# site never makes. Wording here quotes the content, so it changes with it.
# Answers speak as the owner, in the first person (ADR 0011, 2026-11-25), so
# the sentences do too; the technical-support pairs keep the third person, which
# must still pass.
# Questions that name nothing the search can match: the owner's names are
# stop words (every question has them), so these retrieve no page. Claude
# reads the whole site and answers them; the free models get the profile.
vague:
  - locale: pt-br
    question: quem é o victor?
    expect: [/pt-br/about, /pt-br/career/fai-ufscar-2026]
  - locale: pt-br
    question: me fala de você
    expect: [/pt-br/about, /pt-br/career/fai-ufscar-2026]
  - locale: pt-br
    question: o que ele faz?
    expect: [/pt-br/about, /pt-br/career/fai-ufscar-2026, /pt-br/career/freelance-2024]
  - locale: en-us
    question: who is victor?
    expect: [/en-us/about, /en-us/career/fai-ufscar-2026]
  - locale: en-us
    question: tell me about yourself
    expect: [/en-us/about, /en-us/career/fai-ufscar-2026]
  - locale: en-us
    question: is he a good fit for a frontend role?
    expect: [/en-us/about, /en-us/career/xmart-solutions-2024, /en-us/career/freelance-2024, /en-us/projects/learning-react-next]

# First questions: off topic ones (nothing about me or the site, nothing
# found) get a fixed reply and no model call; the vague ones about me never.
offTopic:
  - { locale: pt-br, question: Qual é a capital da França?, offTopic: true }
  - { locale: pt-br, question: Quanto é 17 vezes 23?, offTopic: true }
  - { locale: pt-br, question: Qual a receita de bolo de cenoura?, offTopic: true }
  - { locale: en-us, question: What is the capital of France?, offTopic: true }
  - { locale: en-us, question: What is the weather like tomorrow?, offTopic: true }
  - { locale: en-us, question: How tall is Mount Everest?, offTopic: true }
  # A real match is not noise, even with no word about me: Claude reads it.
  - { locale: pt-br, question: Vai chover amanhã em São Paulo?, offTopic: false }
  # A technology the site is about, found below the noise score (eval run of 2026-11-27).
  - { locale: pt-br, question: Como uso Nix?, offTopic: false }
  - { locale: en-us, question: How do I use Nix?, offTopic: false }
  - { locale: pt-br, question: quem é o victor?, offTopic: false }
  - { locale: pt-br, question: me fala de você, offTopic: false }
  - { locale: pt-br, question: o que ele faz?, offTopic: false }
  - { locale: pt-br, question: vale a pena contratar?, offTopic: false }
  - { locale: en-us, question: who is victor?, offTopic: false }
  - { locale: en-us, question: tell me about yourself, offTopic: false }
  - { locale: en-us, question: is he a good fit for a frontend role?, offTopic: false }

