name: CI

# Validates, builds and tests every pull request and push to main.
#
# Speed (2026-11-28): the end-to-end suite was 9 of the 13 minutes, so it runs
# in 4 shards beside the static checks instead of after them, and a change that
# only touches docs skips the build and the suite. Lint, typecheck, unit tests
# and the build go through Turborepo, whose remote cache skips any task whose
# inputs have not changed since a green run. The single required status is
# "Validate and build" (the `ci-ok` job). docs/architecture/ci.md has the details.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # app=false only when every changed file is documentation the site never reads.
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base to compare with: running everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf 'Changed files:\n%s\n' "$files"
          app=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              # The site publishes the ADRs (/decisions), so they are not just docs.
              docs/decisions/*) app=true ;;
              docs/* | AGENTS.md | CLAUDE.md | README.md | LICENSE | scripts/ci-watch.sh) ;;
              *) app=true ;;
            esac
          done <<< "$files"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Build and end-to-end tests needed: $app"

  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Turborepo's remote cache (Vercel): a task whose inputs match an earlier
    # green run is restored instead of run. Pull requests from forks get no
    # token and fall back to running everything.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Content integrity
        run: pnpm content:check

      - name: Icons in sync
        run: pnpm --filter web icons:check

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Unit tests
        run: pnpm test

  e2e:
    name: End-to-end (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Turborepo's remote cache (Vercel): a task whose inputs match an earlier
    # green run is restored instead of run. Pull requests from forks get no
    # token and fall back to running everything.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Next.js reuses what an earlier build compiled; the newest cache of any
      # commit is a valid start, so the key changes with the sources.
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**', 'content/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # GitHub data comes from a committed snapshot (apps/web/src/lib/github-fixture.ts):
      # no network, no rate limit, the same pages on every run.
      - name: Production build
        run: pnpm build
        env:
          GITHUB_FIXTURES: "1"

      # The browser is keyed on the lockfile, which pins @playwright/test (to nixpkgs' version).
      - name: Restore Playwright's Chromium
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: End-to-end smoke tests
        run: pnpm --filter web test:e2e --shard=${{ matrix.shard }}/4
        env:
          GITHUB_FIXTURES: "1"

      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  e2e-report:
    name: End-to-end report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: apps/web/all-blob-reports
          merge-multiple: true

      - name: Merge the shards into one HTML report
        run: pnpm --filter web exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  ci-ok:
    # The name the branch's checks have always had, so links and habits keep working.
    name: Validate and build
    needs: [changes, checks, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
          APP: ${{ needs.changes.outputs.app }}
        run: |
          echo "changes=$CHANGES checks=$CHECKS e2e=$E2E (app=$APP)"
          [ "$CHANGES" = success ] && [ "$CHECKS" = success ] || exit 1
          if [ "$APP" = true ]; then [ "$E2E" = success ] || exit 1; fi
