# Sources: v1 career timeline (duties) and Jira PWL-33 (learnings). Title,
# dates, location and the LinkedIn duties come from the author's LinkedIn
# profile (PDF export), chosen as the reference by the author on 2026-11-23.
id: cultura-inglesa-2022
organization: cultura-inglesa
location: São Paulo, SP, Brazil
positions:
  - title: { en-us: IT Support Technician Intern, pt-br: Estagiário de suporte técnico de TI }
    employmentType: internship
    start: 2022-09
    end: 2023-03

summary:
  en-us: IT support for staff and classrooms, working alongside the infrastructure team.
  pt-br: Suporte de TI para colaboradores e salas de aula, junto ao time de infraestrutura.

responsibilities:
  en-us:
    - Handled support tickets in Jira and prioritized critical incidents
    - Preventive maintenance to reduce recurring failures
    - Prepared workstations for new employees and helped with their onboarding
    - Gave field support teams the information and data they needed
    - Troubleshot hardware, software and user access issues with the infrastructure team
    - Preventive and corrective maintenance of desktops, notebooks, printers and peripherals
    - Used support and remote access tools to handle requests and help users
    - Formatted and configured Windows and ChromeOS devices for internal users
  pt-br:
    - Atendimento de chamados no Jira e priorização de incidentes críticos
    - Manutenção preventiva para reduzir falhas recorrentes
    - Preparação de máquinas para novos colaboradores e apoio no onboarding
    - Apoio ao suporte de campo com informações e dados
    - Diagnóstico de problemas de hardware, software e acesso de usuários com o time de infraestrutura
    - Manutenção preventiva e corretiva de desktops, notebooks, impressoras e periféricos
    - Ferramentas de suporte e de acesso remoto para atender chamados e ajudar usuários
    - Formatação e configuração de dispositivos Windows e ChromeOS para usuários internos

learnings:
  en-us:
    - How IT infrastructure is run in a multi-site organization
    - Helping the infrastructure team keep student and employee data secure
    - Supporting internal users, including during onboarding
  pt-br:
    - Como a infraestrutura de TI funciona em uma organização com várias unidades
    - Apoiar o time de infraestrutura a manter seguros os dados de alunos e colaboradores
    - Atender usuários internos, inclusive no onboarding

technologies: [jira]
skills: [it-support]

pendingReview:
  - claim: Resolved 40+ tickets per week with 98% satisfaction
    source: v1 career timeline
  - claim: Reduced recurring failures by 20% through preventive maintenance
    source: v1 career timeline
  - claim: Set up 60+ machines for new employees
    source: v1 career timeline

