    location: Santo André, SP, Brazil
    responsibilities:
      en-us:
        - Developed user interfaces with React, Vite and TypeScript
        - Supported front-end improvements for XGuardian products and internal tools
        - Worked with developers, designers and product stakeholders to deliver maintainable UI components
      pt-br:
        - Desenvolvimento de interfaces com React, Vite e TypeScript
        - Apoio a melhorias de front end nos produtos XGuardian e em ferramentas internas
        - Trabalho com desenvolvedores, designers e pessoas de produto para entregar componentes de UI fáceis de manter
  - title: { en-us: Full Stack Developer, pt-br: Desenvolvedor full stack }
    start: 2024-09
    end: 2025-04
    location: Santo André, SP, Brazil
  - title: { en-us: Software Developer, pt-br: Desenvolvedor de software }
    employmentType: freelance
    start: 2025-04
    end: 2025-11
    location: São Carlos, SP, Brazil
    note:
      en-us: Freelance and remote, after the full-time period.
      pt-br: Freelance e remoto, depois do período em tempo integral.
    responsibilities:
      en-us:
        - Backend development and maintenance of XGuardian products, in a cybersecurity product environment
        - Automation and DevOps tasks to improve development and deployment workflows
        - Technical improvements to internal and external product components
      pt-br:
        - Desenvolvimento back-end e manutenção dos produtos XGuardian, em um ambiente de produto de cibersegurança
        - Automação e tarefas de DevOps para melhorar os fluxos de desenvolvimento e deploy
        - Melhorias técnicas em componentes internos e externos do produto

summary:
  en-us: My first job as a developer, on XGuardian, Xmart's application security platform.
  pt-br: Meu primeiro emprego como desenvolvedor, no XGuardian, a plataforma de segurança de aplicações da Xmart.

context:
  en-us: >-
    XGuardian brings application security scans into the development workflow. The work spanned
    CI/CD automation, front end and back end, with planning in Scrumban.
  pt-br: >-
    O XGuardian leva scans de segurança de aplicações para dentro do fluxo de desenvolvimento.
    O trabalho passou por automação de CI/CD, front end e back end, com planejamento
    em Scrumban.

responsibilities:
  en-us:
    - Automated SAST and SCA scans with GitHub Actions
    - Fixed front-end and back-end bugs and implemented new features
    - Optimized front-end requests
    - Developed front-end applications with React, Vite and TypeScript
    - Built and maintained back-end services with Python and FastAPI
    - Contributed to vulnerability analysis workflows with SAST, SCA, DAST and container analysis
    - Helped maintain CI/CD pipelines with Jenkins, GitHub and shell scripts
    - Worked with AWS services for deployment and environment automation
    - Contributed to internal tools, IDE extensions and interactive dashboards
    - Took part in agile planning with Scrumban and Jira, and documented work in Confluence
  pt-br:
    - Automação de scans SAST e SCA com GitHub Actions
    - Correção de bugs no front end e no back end e implementação de novas funcionalidades
    - Otimização de requisições no front end
    - Desenvolvimento de aplicações front-end com React, Vite e TypeScript
    - Desenvolvimento e manutenção de serviços back-end com Python e FastAPI
    - Fluxos de análise de vulnerabilidades com SAST, SCA, DAST e análise de containers
    - Manutenção de pipelines de CI/CD com Jenkins, GitHub e shell scripts
    - Serviços da AWS para deploy e automação de ambientes
    - Ferramentas internas, extensões de IDE e dashboards interativos
    - Planejamento ágil com Scrumban e Jira, e documentação no Confluence

contributions:
  en-us:
    - Shell and YAML automation for GitHub Actions pipelines
    - A VS Code extension built on the VS Code API with Node.js
  pt-br:
    - Automação em Shell e YAML para pipelines no GitHub Actions
    - Uma extensão para o VS Code com a API do VS Code em Node.js

learnings:
  en-us:
    - Pipelines and CI/CD, including Jenkins pipelines that block on tests, linting and formatting
    - Application security scanning (SAST, SCA, DAST and container scanning), vulnerability analysis and false positives
    - DevSecOps as a practice, not a tool
    - Teamwork and agile planning
  pt-br:
    - Pipelines e CI/CD, incluindo pipelines no Jenkins que bloqueiam em testes, linter e indentação
    - Scans de segurança (SAST, SCA, DAST e container scanning), análise de vulnerabilidades e falsos positivos
    - DevSecOps como prática, não como ferramenta
    - Trabalho em equipe e planejamento ágil

technologies: [github-actions, jenkins, aws, react, vite, typescript, python, fastapi, nodejs, vscode, bash, jira, confluence, scrumban]
skills: [devsecops, ci-cd, web-development]

evidence:
  - { label: XGuardian, url: "https://xguardianplatform.io/", kind: website }

