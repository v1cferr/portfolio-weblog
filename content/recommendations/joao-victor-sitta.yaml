text:
  pt-br:
    - >-
      Tive a satisfação de estudar com o Victor no programa Transforme-se e posso dizer que foi uma das
      pessoas com quem mais aprendi durante essa jornada. Sua inteligência, capacidade de análise e
      visão estratégica se destacam naturalmente em qualquer atividade ou projeto.
    - >-
      Victor possui uma característica que admiro muito: sabe liderar sem deixar de ouvir. Ele
      valoriza diferentes pontos de vista, incentiva a participação de todos e, quando necessário, sabe
      se posicionar com segurança e tomar decisões. Essa combinação de escuta, respeito e liderança faz
      com que seja uma referência para quem trabalha ao seu lado.
    - >-
      Além de ser extremamente competente no que faz, é uma pessoa dedicada, confiável e comprometida
      com a excelência. Gostei muito de conhecê-lo e de compartilhar essa experiência de aprendizado.
      Tenho certeza de que continuará alcançando grandes resultados e contribuindo positivamente por
      onde passar. Recomendo o Victor com total confiança.
  en-us:
    - >-
      I had the satisfaction of studying with Victor in the Transforme-se program and can say he was
      one of the people I learned the most from on that journey. His intelligence, analytical skills and
      strategic vision stand out naturally in any activity or project.
    - >-
      Victor has a trait I really admire: he knows how to lead without ceasing to listen. He values
      different points of view, encourages everyone to take part and, when needed, knows how to take a
      stand with confidence and make decisions. This combination of listening, respect and leadership
      makes him a reference for those who work alongside him.
    - >-
      Besides being extremely competent at what he does, he is a dedicated, reliable person committed
      to excellence. I really enjoyed meeting him and sharing this learning experience. I am sure he
      will keep achieving great results and contributing positively wherever he goes. I recommend
      Victor with full confidence.
