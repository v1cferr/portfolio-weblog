about:
  en-us:
    - >-
      My path into software did not start in software. It went through industrial processes,
      IT infrastructure, networks and support before reaching software engineering and, now,
      AI systems.
    - >-
      Each step left something that still shapes how I work: continuous improvement and
      production flow from the plant floor, care for people and data from IT support, patience
      and troubleshooting from network support, and pipelines, security and teamwork from
      my first development job.
    - >-
      This hub is where I keep that history and what I build next: experiences, projects,
      studies and an engineering journal, all versioned as plain content in Git.
  pt-br:
    - >-
      Meu caminho até o software não começou no software. Passou por processos industriais,
      infraestrutura de TI, redes e suporte antes de chegar à engenharia de software e, agora,
      a sistemas de IA.
    - >-
      Cada etapa deixou algo que ainda molda como trabalho: melhoria contínua e fluxo de
      produção na fábrica, cuidado com pessoas e dados no suporte de TI, paciência e
      diagnóstico no suporte de redes, e pipelines, segurança e trabalho em equipe no meu
      primeiro emprego como desenvolvedor.
    - >-
      Este hub é onde guardo essa história e o que construo a seguir: experiências, projetos,
      estudos e um diário de engenharia, tudo versionado como conteúdo em Git.

focus:
  en-us:
    - Retrieval-augmented generation and LLM integration with verifiable sources
    - Python and FastAPI back ends, React and Next.js front ends
    - Reproducible local infrastructure with Nix and NixOS
    - Automation of everyday workflows
  pt-br:
    - RAG e integração com LLMs com fontes verificáveis
    - Back ends em Python e FastAPI, front ends em React e Next.js
    - Infraestrutura local reproduzível com Nix e NixOS
    - Automação de fluxos do dia a dia

