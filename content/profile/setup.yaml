            pt-br: Gabinete Sharkoon VG6-W, preto, com lateral de vidro e ventoinhas frontais de luz azul
          credit:
            label: Sharkoon
            url: https://pt.sharkoon.com/product/VG6W
        note:
          pt-br: Utilizei de 2021 até 2024. Quebrou muito o galho, mas não tem suporte para fans superiores e ainda tinha espaço
            para leitor de CD/DVD. Troquei por um gabinete com airflow melhor e suporte para fans em cima.
        since: 2021-03
        until: 2024-01
      - id: mouse-redragon-cobra-m711
        role:
          pt-br: Mouse
        model: Redragon Cobra M711
        url: https://www.redragon.com.br/cobra
        # Official image: https://static.wixstatic.com/media/71a6c2_8828e12dc0f240cdb6d21df6502f241d~mv2.png (redragon.com.br)
        media:
