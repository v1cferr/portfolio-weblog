          width: 1188
          height: 1188
          alt:
            en-us: Redragon Cobra M711 mouse, black, seen from above with its RGB strip
            pt-br: Mouse Redragon Cobra M711, preto, visto de cima com a faixa RGB
          credit:
            label: Redragon
            url: https://www.redragon.com.br/cobra
        note:
          pt-br: Utilizei de 2018 até 2024. Mouse bom demais, depois de anos de uso intenso ele começou a dar double click. Mas
            pelo preço, compensa bastante, muito custo-beneficio. Troquei por um Razer DeathAdder V2.
        since: 2018-06
        until: 2024-03
      - id: mousepad-havit-hv-mp830
        role:
          pt-br: Mousepad
        model: Havit HV-MP830
        # Checked 2026-11-27: this store no longer resolves, and Havit's official site
