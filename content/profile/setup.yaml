        url: https://www.gigabyte.com/br/Graphics-Card/GV-N3050GAMING-OC-8GD
        note:
          pt-br: Utilizei de 2022 até meados de 2026. Deu conta do recado em 1080p, mas os 8GB de VRAM começaram a apertar e o
            driver proprietário sempre foi o ponto de atrito no Linux. Vendida para bancar a troca pela Arc B580, que tem 12GB
            e roda com driver open-source (xe + Mesa).
        since: 2022-08
        until: 2026-07

