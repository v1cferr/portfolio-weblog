          credit:
            label: Redragon
            url: https://www.redragon.com.br/adiemus
        note:
          pt-br: Utilizei de 2022 até 2025. Excelente custo-benefício para desktop, som claro para uso geral e iluminação discreta.
            Limitação principal foi a ausência de subwoofer e potência reduzida para músicas/filmes com grave mais encorpado.
