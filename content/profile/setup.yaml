  - src: /setup/20260915.jpg
    width: 2400
    height: 1800
    date: 2026-09-15
    alt:
      en-us: "A vertical monitor with a coding session beside the main monitor showing fastfetch on NixOS and a blurred video"
      pt-br: "Um monitor na vertical com uma sessão de programação ao lado do monitor principal com o fastfetch no NixOS e um vídeo desfocado"
    caption:
      en-us: "NixOS on the Kingston NVMe, with the second monitor turned vertical."
      pt-br: "NixOS no NVMe Kingston, com o segundo monitor na vertical."
  - src: /setup/20260723.jpg
    width: 2400
    height: 1800
    date: 2026-07-23
    alt:
      en-us: "fastfetch on the monitor: NixOS 26.05, Hyprland, Intel Core i5-11400 and Intel Arc B580"
