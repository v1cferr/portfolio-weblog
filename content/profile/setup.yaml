        note:
          pt-br: Utilizei de 2023 até meados de 2026. Cadeira de entrada que quebrou muito o galho, mas com o tempo a espuma começou
            a ceder e senti falta de ajustes mais precisos (como braços 3D). Substituída pela Pichau Omega S.
        since: 2023-04
        until: 2026-05
      - id: gpu-gigabyte-rtx-3050
        role:
          pt-br: Placa de vídeo (GPU)
        model: Gigabyte NVIDIA GeForce RTX 3050 Gaming OC, LHR, 8GB, GDDR6, DLSS, Ray Tracing
        url: https://www.gigabyte.com/br/Graphics-Card/GV-N3050GAMING-OC-8GD
        # Official image: https://static.gigabyte.com/StaticFile/Image/Global/b967c8e2d3c9f60d902905f154934478/ProductRemoveBg/30760
        media:
          src: /setup/parts/gpu-gigabyte-rtx-3050.png
          width: 1052
          height: 1052
          alt:
            en-us: Gigabyte GeForce RTX 3050 Gaming OC 8G graphics card with its box
            pt-br: Placa de vídeo Gigabyte GeForce RTX 3050 Gaming OC 8G com a caixa
          credit:
            label: Gigabyte
            url: https://www.gigabyte.com/br/Graphics-Card/GV-N3050GAMING-OC-8GD
        note:
          pt-br: Utilizei de 2022 até meados de 2026. Deu conta do recado em 1080p, mas os 8GB de VRAM começaram a apertar e o
